name: Check Debian tuigreet
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: package-validation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Build pinned environment
        run: |
          source build/inputs.env
          docker build --build-arg DEBIAN_SNAPSHOT="$DEBIAN_SNAPSHOT" -t bme-builder -f build/Dockerfile .
      - name: Static and lifecycle checks
        run: docker run --rm -v "$PWD:/src" bme-builder build/check.sh
      - name: Install official Debian package and exercise terminal startup
        run: |
          source build/inputs.env
          mkdir -p out
          set -o pipefail
          docker run --rm -e TUIGREET_VERSION="$TUIGREET_VERSION" -v "$PWD:/src" bme-builder -euo pipefail -c '
            apt-get update
            # Configure the real account owner before tuigreet runs tmpfiles.
            apt-get install -y --no-install-recommends greetd
            getent passwd _greetd
            apt-get install -y --no-install-recommends "tuigreet=$TUIGREET_VERSION"
            test "$(dpkg-query -W -f='\''${db:Status-Status} ${Version}'\'' tuigreet)" = "installed $TUIGREET_VERSION"
            python3 build/check-tuigreet-pty.py /usr/bin/tuigreet
          ' 2>&1 | tee out/tuigreet-check.log
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: debian-tuigreet-check-${{ github.sha }}
          path: out/tuigreet-check.log
          if-no-files-found: warn
          retention-days: 14

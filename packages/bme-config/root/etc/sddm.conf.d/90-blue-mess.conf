[General]
DisplayServer=x11
HaltCommand=/sbin/openrc-shutdown --poweroff now
RebootCommand=/sbin/openrc-shutdown --reboot now
InputMethod=

[Theme]
# SDDM's embedded QtQuick theme; no Plasma or external theme dependency.
Current=
EnableAvatars=false
Font=DejaVu Sans

[X11]
ServerPath=/usr/lib/xorg/Xorg
ServerArguments=-nolisten tcp
SessionDir=/usr/share/blue-mess/xsessions
SessionCommand=/etc/sddm/Xsession

[Users]
DefaultPath=/usr/local/bin:/usr/bin:/bin:/usr/local/sbin:/usr/sbin:/sbin
MinimumUid=1000
MaximumUid=60000
HideUsers=root,sddm,_greetd
RememberLastUser=true
RememberLastSession=true

[Autologin]
User=
Relogin=false

# Keep /dev/console on the diagnostics VT, even after switching to the greeter.
# Remove older console/quiet arguments before appending exactly one of each type.
bme_args=
for bme_arg in ${GRUB_CMDLINE_LINUX:-}; do
    case "$bme_arg" in console=*|quiet) ;; *) bme_args="$bme_args $bme_arg" ;; esac
done
GRUB_CMDLINE_LINUX="$bme_args console=ttyS0,115200n8 console=tty4"
bme_args=
for bme_arg in ${GRUB_CMDLINE_LINUX_DEFAULT:-}; do
    case "$bme_arg" in console=*|quiet) ;; *) bme_args="$bme_args $bme_arg" ;; esac
done
GRUB_CMDLINE_LINUX_DEFAULT=$bme_args
unset bme_args bme_arg

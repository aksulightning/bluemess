[terminal]
vt = 1
switch = true

[general]
# The authenticated login shell loads the profiles once.
source_profile = false

[default_session]
# Keep visible output changing every second while waiting for login input.
command = "/usr/bin/tuigreet --time --time-format '%H:%M:%S' --cmd '/usr/bin/ash -il'"
user = "_greetd"
